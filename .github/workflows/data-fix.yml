name: data-fix

# MANUAL ONLY. Small, reversible edits to reference data that the forms read
# from Mongo — nothing here touches Turboly, so it takes no browser and does NOT
# join the turboly-push lane: it can never delay a customer's order.
on:
  workflow_dispatch:
    inputs:
      make:
        description: 'TIPE KENDARAAN — merk, mis. JAECOO (kosongkan kalau mau ubah varian jasa)'
        type: string
        default: ''
      model:
        description: 'TIPE KENDARAAN — tipe yang ditambahkan, mis. J7'
        type: string
        default: ''
      kind:
        description: 'TIPE KENDARAAN — masuk ke daftar mobil, motor, atau keduanya'
        type: choice
        options: [car, motorcycle, both]
        default: car
      product_sku:
        description: 'KATALOG JASA — SKU yang mau dikenalkan ke mirror, mis. HSB-NAW-HSB'
        type: string
        default: ''
      product_name:
        description: 'KATALOG JASA — nama persis seperti di Turboly, mis. High Speed Balance'
        type: string
        default: ''
      service_code:
        description: 'VARIAN JASA — kode jasa, mis. BALANCING_ON_CAR (kosongkan kalau mau tambah tipe kendaraan)'
        type: string
        default: ''
      default_sku:
        description: 'VARIAN JASA — SKU yang jadi pilihan default, mis. HSB-NAW-HSB'
        type: string
        default: ''
      order_skus:
        description: 'VARIAN JASA — urutan tampil, dipisah koma: "HSB-NAW-HSB,HSB-NAW-VIP" (sisanya menyusul di bawah)'
        type: string
        default: ''
      add_skus:
        description: 'VARIAN JASA — SKU baru, dipisah koma: "HSB-NAW-HSB=High Speed Balance,HSB-NAW-VIP=High Speed Balance VIP"'
        type: string
        default: ''
      service_create:
        description: 'VARIAN JASA — centang kalau KODE JASA-nya baru. Dipakai untuk jasa tanpa tombol sendiri, yang hanya muncul di "Pekerjaan lain (tulis / pilih)".'
        type: boolean
        default: false

jobs:
  add-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: v1-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci
      - name: Build core
        run: npm run build -w @spk/core
      - name: Add vehicle model
        if: inputs.make != '' && inputs.model != ''
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
        run: |
          node --import tsx apps/worker/src/vehicle-model-add.ts \
            --make="${{ inputs.make }}" --model="${{ inputs.model }}" --kind="${{ inputs.kind }}"

      - name: Teach the catalogue mirror a SKU
        if: inputs.product_sku != '' && inputs.product_name != ''
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
        run: |
          node --import tsx apps/worker/src/service-product-add.ts \
            --sku="${{ inputs.product_sku }}" --name="${{ inputs.product_name }}"

      - name: Set service variants
        if: inputs.service_code != ''
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
          # Every input reaches the shell as a VALUE, never spliced into the
          # script text. `${{ }}` is substituted before bash parses the line, so
          # a quote or newline in a name used to escape the argument and run as
          # a command — in a step holding MONGODB_URI. Same hardening as
          # branch-add.yml.
          ADD_SKUS: ${{ inputs.add_skus }}
          SERVICE_CODE: ${{ inputs.service_code }}
          DEFAULT_SKU: ${{ inputs.default_sku }}
          ORDER_SKUS: ${{ inputs.order_skus }}
          SERVICE_CREATE: ${{ inputs.service_create }}
        run: |
          args=()
          IFS=',' read -ra pairs <<< "$ADD_SKUS"
          for p in "${pairs[@]}"; do
            if [ -n "$p" ]; then args+=(--add="$p"); fi
          done
          if [ -n "$DEFAULT_SKU" ]; then args+=(--default="$DEFAULT_SKU"); fi
          if [ -n "$ORDER_SKUS" ]; then args+=(--order="$ORDER_SKUS"); fi
          if [ "$SERVICE_CREATE" = "true" ]; then args+=(--create); fi
          node --import tsx apps/worker/src/service-option-set.ts \
            --code="$SERVICE_CODE" \
            "${args[@]}"
