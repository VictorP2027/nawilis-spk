name: flow-to-turboly

# Drains the flow_jobs queue: the flow-board actions (Approve SO, Buat Work
# Order, Start, Selesai, QC OK, Buat/Selesaikan Invoice, customer registration)
# queued by /api/flow/action are executed serially against Turboly by the
# one-shot flow worker, which then exits. Instant runs come from the web app's
# repository_dispatch; the 5-min cron is the safety net for anything missed and
# for transiently-requeued jobs.
#
# SETUP IS THE JOB'S BIGGEST COST, not the Turboly work: a corporate
# registration measured ~120s wall clock of which ~60-90s was runner setup.
# Everything before "Drain flow jobs" is therefore cached and made skippable.

on:
  repository_dispatch:
    types: [flow-action]     # fired by /api/flow/action the instant a job is queued
  schedule:
    - cron: '*/5 * * * *'    # safety net: requeued/missed jobs
  workflow_dispatch:
    inputs:
      debug_screenshots:
        description: 'Upload RPA screenshots on failure (contains customer PII — public repo)'
        type: boolean
        default: false
      skip_browser:
        description: 'Lewati pemasangan Chromium — HANYA jika semua job di antrean berjalan lewat HTTP (mis. pendaftaran customer). Salah pilih = job gagal permanen.'
        type: boolean
        default: false

# Turboly = ONE SESSION PER USER: share the pusher's concurrency group so the
# flow worker NEVER runs in parallel with push.yml / sync (belt-and-braces on
# top of the flow_jobs CAS claim).
concurrency:
  group: turboly-push
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Opt-IN only, never inferred from client_payload.action: this worker
      # drains the WHOLE queue, so one register_customer dispatch can still pick
      # up an Approve SO job that needs a browser. The caller asserts "nothing
      # queued needs a browser"; every other trigger (cron, plain dispatch)
      # leaves this false and installs Chromium exactly as before.
      # Both the JSON boolean and the string are accepted — a caller that
      # stringifies the flag should not silently get the slow path.
      SKIP_BROWSER: ${{ github.event.client_payload.skip_browser == true || github.event.client_payload.skip_browser == 'true' || inputs.skip_browser == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
          # Deliberately no `cache: npm`. That caches ~/.npm (the tarballs), which
          # is ~250MB to restore and only ever speeds up `npm ci` — and the
          # node_modules cache below skips `npm ci` outright on the common path.

      # The browser cache must track the browser, not unrelated lockfile churn:
      # keyed on package-lock.json it was thrown away by every dependency bump,
      # buying a fresh ~130MB Chromium download for a change to, say, zod.
      - name: Resolve Playwright version
        id: pw
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version || ''" 2>/dev/null || true)"
          # Fall back to the old whole-lockfile key rather than failing the run:
          # a stale key here would silently pair a cached browser with a
          # different Playwright build, which fails at launch.
          [ -n "$v" ] || v="lock-$(sha256sum package-lock.json | cut -c1-16)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 588MB / ~15k files, and 277MB of it is next + @next, which no workflow
      # runs. Restoring the tree beats rebuilding it: `npm ci` wipes node_modules
      # first, so there are deliberately no restore-keys — a partial hit would be
      # downloaded and then deleted.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: v1-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          # mongodb-memory-server's postinstall downloads a ~100MB mongod binary.
          # It is a root devDependency used only by tests/e2e.mts and local dev —
          # no workflow starts an in-memory Mongo, so this was pure download on
          # every run. NOT --omit=dev: tsx and typescript are devDependencies and
          # every worker step runs through them.
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci

      # @spk/core's package.json exports point at dist/, so tsx cannot skip this
      # build — but 10.7k lines of TypeScript recompile identically whenever the
      # sources have not changed. The key covers sources, both tsconfigs and the
      # lockfile (the TypeScript version), so a hit can never be stale.
      - name: Cache built core
        id: core-dist
        uses: actions/cache@v4
        with:
          path: packages/core/dist
          key: v1-core-dist-${{ runner.os }}-${{ hashFiles('packages/core/src/**', 'packages/core/tsconfig.json', 'tsconfig.base.json', 'package-lock.json') }}

      - name: Build core
        if: steps.core-dist.outputs.cache-hit != 'true'
        run: npm run build -w @spk/core

      - name: Cache Chromium
        id: pw-cache
        if: env.SKIP_BROWSER != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (for Playwright RPA)
        if: env.SKIP_BROWSER != 'true'
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          # --with-deps is an apt-get update + install on every run and is never
          # cached, yet the hosted ubuntu image already carries Chromium's libs;
          # it is worth paying only when we are downloading the browser anyway.
          # The cache-hit branch is not a no-op: it re-verifies the restored
          # binary, so a truncated cache entry self-heals instead of failing at
          # launch inside the Turboly session.
          if [ "$CACHE_HIT" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Registration needs no browser — it POSTs Turboly's own form directly and
      # takes ~1s. Running it BEFORE the browser drain means a registration-only
      # dispatch never pays for launching Chromium and logging in, which was
      # ~15 of the ~16 seconds such a job spent "working".
      - name: Register customers (browserless fast path)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
          TURBOLY_BASE_URL: https://sandbox.turboly.com
          TURBOLY_USERNAME: ${{ secrets.TURBOLY_USERNAME }}
          TURBOLY_PASSWORD: ${{ secrets.TURBOLY_PASSWORD }}
        run: node --import tsx apps/worker/src/http-once.ts

      - name: Drain flow jobs (Turboly lifecycle steps)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
          TURBOLY_BASE_URL: https://sandbox.turboly.com
          TURBOLY_USERNAME: ${{ secrets.TURBOLY_USERNAME }}
          TURBOLY_PASSWORD: ${{ secrets.TURBOLY_PASSWORD }}
          PUSH_MODE: rpa
          PUSH_SCREENSHOT_DIR: .turboly-state/screenshots
        run: node --import tsx apps/worker/src/flow-once.ts

      # Skipped on a browser-free run: there is nothing to collect, and the
      # upload holds the turboly-push concurrency group open a few more seconds
      # while the next registration waits behind it.
      # PUBLIC REPO: these are full-page shots of Turboly forms holding a real
      # customer's name, phone and home address, and an artifact on a public
      # repo is downloadable by anyone. Only ever upload them when a run FAILED
      # and someone explicitly asked for the evidence.
      - name: Upload RPA screenshots (debug evidence)
        if: failure() && inputs.debug_screenshots == true
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots-${{ github.run_id }}
          path: .turboly-state/screenshots/
          if-no-files-found: ignore
          retention-days: 3
