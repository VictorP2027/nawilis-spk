# Second Turboly push worker — IMPLEMENTED BUT DORMANT.
#
# Identical to push.yml except: its own name, its own concurrency lane
# (turboly-push-2 — parallel to worker 1/flow/sync, serialised with nothing),
# worker 2's TURBOLY_USERNAME_2/PASSWORD_2, a cron offset by two minutes so the
# two safety nets interleave, and the gate job below that keeps it a no-op
# until those secrets exist. The claim layer (CAS queued→pushing + unique claim
# + lease + orphan reclaim) already arbitrates two workers racing one document.
#
# Do not set the _2 secrets before scripts/kick-test.mjs passes — the order of
# operations is written in ops/staged/ACTIVATE-PUSH2.md.
#
name: push-to-turboly-w2

# Runs the Redis-free one-shot pusher on a schedule: it finds every `queued`
# SPK in Atlas, creates its Turboly Service Order, verifies it, then exits.
# GitHub's minimum cron interval is 5 min (scheduled runs on busy public repos
# are often delayed a few extra minutes — that's normal). Empty passes never
# touch Turboly: the pusher only logs in when there's actually work to do.
#
# Setup dominates the wall clock here the same way it does in flow.yml, and
# because push/flow/sync share one concurrency group, every second this job
# spends installing is a second a queued registration waits. Chromium stays
# unconditional: PUSH_MODE=rpa means rpaSink drives a real browser.

on:
  repository_dispatch:
    types: [spk-assigned]    # fired by the web app the instant an SPK is assigned → near-instant push
  schedule:
    - cron: '2-59/5 * * * *'    # safety net: catch anything the instant-trigger missed
  workflow_dispatch:
    inputs:
      debug_screenshots:
        description: 'Upload RPA screenshots on failure (contains customer PII — public repo)'
        type: boolean
        default: false       # + a manual "Run workflow" button

# Never let two pushes overlap (belt-and-braces on top of the DB lease/CAS).
concurrency:
  group: turboly-push-2
  cancel-in-progress: false

jobs:
  # INERT UNTIL CONFIGURED — same pattern as alerts.yml. Worker 2 only exists
  # once its own Turboly account does: until TURBOLY_USERNAME_2 is set as a
  # secret (which per ops/staged/ACTIVATE-PUSH2.md happens only after the kick
  # test passes), every run stops here in a few seconds, green, having touched
  # nothing. Setting the two secrets IS the activation; no file moves.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.cfg.outputs.configured }}
    steps:
      - name: Check worker 2 configuration
        id: cfg
        env:
          U2: ${{ secrets.TURBOLY_USERNAME_2 }}
        run: |
          if [ -z "$U2" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "TURBOLY_USERNAME_2 not set — worker 2 inert, skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
          # Deliberately no `cache: npm`. That caches ~/.npm (the tarballs), which
          # is ~250MB to restore and only ever speeds up `npm ci` — and the
          # node_modules cache below skips `npm ci` outright on the common path.

      # The browser cache must track the browser, not unrelated lockfile churn:
      # keyed on package-lock.json it was thrown away by every dependency bump,
      # buying a fresh ~130MB Chromium download for a change to, say, zod.
      - name: Resolve Playwright version
        id: pw
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version || ''" 2>/dev/null || true)"
          # Fall back to the old whole-lockfile key rather than failing the run:
          # a stale key here would silently pair a cached browser with a
          # different Playwright build, which fails at launch.
          [ -n "$v" ] || v="lock-$(sha256sum package-lock.json | cut -c1-16)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 588MB / ~15k files, and 277MB of it is next + @next, which no workflow
      # runs. Restoring the tree beats rebuilding it: `npm ci` wipes node_modules
      # first, so there are deliberately no restore-keys — a partial hit would be
      # downloaded and then deleted. Same key as flow/sync/monitor, one entry.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: v1-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          # mongodb-memory-server's postinstall downloads a ~100MB mongod binary.
          # It is a root devDependency used only by tests/e2e.mts and local dev —
          # no workflow starts an in-memory Mongo, so this was pure download on
          # every run. NOT --omit=dev: tsx and typescript are devDependencies and
          # every worker step runs through them.
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci

      # @spk/core's package.json exports point at dist/, so tsx cannot skip this
      # build — but 10.7k lines of TypeScript recompile identically whenever the
      # sources have not changed. The key covers sources, both tsconfigs and the
      # lockfile (the TypeScript version), so a hit can never be stale.
      - name: Cache built core
        id: core-dist
        uses: actions/cache@v4
        with:
          path: packages/core/dist
          key: v1-core-dist-${{ runner.os }}-${{ hashFiles('packages/core/src/**', 'packages/core/tsconfig.json', 'tsconfig.base.json', 'package-lock.json') }}

      - name: Build core
        if: steps.core-dist.outputs.cache-hit != 'true'
        run: npm run build -w @spk/core

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (for Playwright RPA)
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          # --with-deps is an apt-get update + install on every run and is never
          # cached, yet the hosted ubuntu image already carries Chromium's libs;
          # it is worth paying only when we are downloading the browser anyway.
          # The cache-hit branch is not a no-op: it re-verifies the restored
          # binary, so a truncated cache entry self-heals instead of failing at
          # launch inside the Turboly session.
          if [ "$CACHE_HIT" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Push queued SPKs to Turboly
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
          TURBOLY_BASE_URL: https://live.turboly.com
          TURBOLY_USERNAME: ${{ secrets.TURBOLY_USERNAME_2 }}
          TURBOLY_PASSWORD: ${{ secrets.TURBOLY_PASSWORD_2 }}
          PUSH_MODE: rpa
          # Approval is a HUMAN step on the flow board now (Approve SO button).
          # The pusher only creates the SO; auto-clicking Approve skipped the
          # one review point staff asked to keep.
          PUSH_APPROVE: 'false'
          # ONE CAR, ONE SERVICE ORDER (Jane, Turboly, 2026-08-18): an SPK for a
          # car whose Check & Go was already pushed inside the window has its
          # lines APPENDED to that order instead of opening a second one. Set
          # 'false' to return to one order per document.
          # Cek n Go joins the same car's SPK order (Turboly's own advice).
          MERGE_CHECKGO_INTO_SPK: 'true'
          # Opposite direction (SPK joins a Check & Go order) stays off: the SPK
          # path keeps behaving exactly as it does today.
          MERGE_INTO_CHECKGO_SO: 'false'
          MERGE_WINDOW_HOURS: '24'
          PUSH_SCREENSHOT_DIR: .turboly-state/screenshots
        run: node --import tsx apps/worker/src/push-once.ts

      # PUBLIC REPO: these are full-page shots of Turboly forms holding a real
      # customer's name, phone and home address, and an artifact on a public
      # repo is downloadable by anyone. Only ever upload them when a run FAILED
      # and someone explicitly asked for the evidence.
      - name: Upload RPA screenshots (debug evidence)
        if: failure() && inputs.debug_screenshots == true
        uses: actions/upload-artifact@v4
        with:
          name: rpa-screenshots-${{ github.run_id }}
          path: .turboly-state/screenshots/
          if-no-files-found: ignore
          retention-days: 3
