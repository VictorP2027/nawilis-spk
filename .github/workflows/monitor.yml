name: pipeline-monitor

# Alert system: every 15 minutes, check Atlas for failed or stuck pushes.
# When something NEW is broken the job exits 1 → the run turns red and GitHub
# emails the repo owner (Settings → Notifications → Actions controls this).
# Each problem alerts exactly once — the doc is marked alertedAt so a standing
# failure doesn't email every 15 minutes; an admin retry that fails again DOES
# re-alert.
#
# monitor.mjs imports exactly one package (the `mongodb` driver): no core
# build, no Chromium. The only setup worth paying for is restoring the tree
# the other three workflows already cached.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
          # Deliberately no `cache: npm`. That caches ~/.npm (the tarballs), which
          # is ~250MB to restore and only ever speeds up `npm ci` — and the
          # node_modules cache below skips `npm ci` outright on the common path.

      # Same key as push/flow/sync, so this job reads the entry they wrote
      # instead of doing its own full install 96 times a day.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: v1-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          # mongodb-memory-server's postinstall downloads a ~100MB mongod binary.
          # It is a root devDependency used only by tests/e2e.mts and local dev —
          # no workflow starts an in-memory Mongo, so this was pure download on
          # every run. NOT --omit=dev: tsx and typescript are devDependencies and
          # every worker step runs through them.
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci

      - name: Check for failed / stuck pushes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: spk
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/monitor.mjs
